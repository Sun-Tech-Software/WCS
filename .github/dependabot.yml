# Dependency updates (CONTRIBUTING.md, "Dependencies"): one grouped pull request a week per group,
# for the NuGet packages of every project and for the GitHub Actions of the workflows. A pull
# request of Dependabot is reviewed like any other: CI restores in locked mode, so it must carry the
# updated packages.lock.json files, and the SBOM job fails until sbom/wcs.cdx.json is regenerated.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # FluentUI 5 is a major version that breaks the web editor (its browser tests fail with it,
      # 16/10/2026): the move to 5 is its own piece of work, in the queue of the internal repository.
      - dependency-name: "Microsoft.FluentUI.AspNetCore.Components"
        update-types: ["version-update:semver-major"]
    groups:
      # First match wins: the test tooling before the Microsoft.* group, which would take
      # Microsoft.NET.Test.Sdk and Microsoft.Playwright too.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "Microsoft.Playwright"
          - "bunit*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      other:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
