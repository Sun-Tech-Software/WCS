# The web editor in a real browser: Wcs.WebEditor.Browser.Test drives Chromium (Playwright) against a
# real Wcs.Host process. Kept apart from ci.yml because it is the slowest suite and needs a browser.
#
# Windows: the tests start the host executable named by WCS_HOST_EXE (Wcs.Host.exe) and the project's
# README describes the Windows setup; Linux has not been verified. The host is built first and the
# tests run with --no-build, as the README asks: the tests do not rebuild the host themselves.
name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

defaults:
  run:
    shell: pwsh

jobs:
  browser:
    name: Web editor in Chromium (Playwright)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked mode)
        run: dotnet restore Wcs.slnx --locked-mode
      - name: Build the host
        run: dotnet build WCS/Wcs.Host/src/Wcs.Host.csproj -c Debug --no-restore
      - name: Build the browser tests
        run: dotnet build WCS/Wcs.WebEditor/tests/Wcs.WebEditor.Browser.Test/Wcs.WebEditor.Browser.Test.csproj -c Debug --no-restore
      - name: Install Chromium for Playwright
        run: ./WCS/Wcs.WebEditor/tests/Wcs.WebEditor.Browser.Test/bin/Debug/net10.0/playwright.ps1 install chromium
      - name: Test
        run: |
          $env:WCS_HOST_EXE = Join-Path $PWD 'WCS/Wcs.Host/src/bin/Debug/net10.0/Wcs.Host.exe'
          dotnet test WCS/Wcs.WebEditor/tests/Wcs.WebEditor.Browser.Test/Wcs.WebEditor.Browser.Test.csproj -c Debug --no-build --logger "console;verbosity=detailed" --logger "trx;LogFileName=Wcs.WebEditor.Browser.Test.trx" --results-directory TestResults/browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-browser
          path: TestResults
          if-no-files-found: ignore
      - name: The working tree stays clean
        run: |
          $dirty = git status --porcelain
          if ($dirty) { $dirty; throw 'The job changed tracked files or left files that .gitignore does not cover.' }
