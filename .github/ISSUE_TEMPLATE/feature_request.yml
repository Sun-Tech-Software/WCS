name: Feature request
description: Suggest a change or an addition to the WCS.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome. They are considered, accepted or declined at Sun Tech's discretion,
        with no guaranteed response time ([CONTRIBUTING.md](https://github.com/Sun-Tech-Software/WCS/blob/main/CONTRIBUTING.md),
        [SUPPORT.md](https://github.com/Sun-Tech-Software/WCS/blob/main/SUPPORT.md)). For a large change, agree on the approach here before
        opening a pull request.

        **Do not describe a vulnerability here**: use private vulnerability reporting
        ([SECURITY.md](https://github.com/Sun-Tech-Software/WCS/blob/main/SECURITY.md)).

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What you are trying to do, and why the WCS does not let you do it today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like the WCS to do. Name the API routes, commands, settings or contracts involved, if any.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Engine (Wcs.Engine)
        - Host, HTTP API or SignalR hub (Wcs.Host)
        - Web editor (Wcs.WebEditor)
        - WMS contract or client (Wcs.Wms.Contracts, Wcs.Wms.Client)
        - Host API contract or client (Wcs.Api.Contracts, Wcs.Api.Client)
        - Driver contract (Wcs.Connection.Interface)
        - Sample WMS or sample plant (samples/)
        - Wcs.DbTool
        - Documentation
        - Build, CI or release tooling
        - Other or not sure
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      description: >-
        Would the change alter a contract (host API, WMS contract, driver contract, configuration,
        data files) in a way existing integrations would notice? See docs/versioning-and-compatibility.md.
      options:
        - No, it only adds
        - Yes, it changes or removes something
        - Not sure
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Effect on plant behaviour
      description: >-
        Would the change alter how devices are commanded, how routes are chosen, or what is reported
        to the WMS on a plant already running? The WCS is not a safety system (SAFETY.md); say how
        the change could be tried safely.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you considered, including doing it in your WMS adapter or driver.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: >-
            This request contains no API keys, passwords, tokens, connection strings, personal data,
            customer or plant names, or other confidential information.
          required: true
        - label: I searched the existing issues.
          required: true
